# CI de TriggerBOT: lint + tests en cada push y en cada pull request.
#
# Existe por una razón concreta: el bot se actualiza solo. Al reiniciarse hace
# `git pull` + `npm install` + `node src/index.js`, así que un commit roto no queda
# esperando una revisión: baja el bot en producción hasta que alguien lo note.
# Este workflow es la barrera que hace que eso no llegue a main.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Lint y tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # npm ci (y no npm install) para que CI use EXACTAMENTE las versiones del
      # package-lock.json: si falla por dependencias, se quiere saber acá y no en prod.
      - name: Instalar dependencias
        run: npm ci

      - name: Lint (0 warnings)
        run: npm run lint

      - name: Tests
        run: npm test
